<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Tea Brand Web Site">
    <title>Tea Brand</title>
    <link rel="icon" href="./favicon.png">
    
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    
    <section class="product-details">
      
        <div class="breadcrumb">
            HOME / COLLECTIONS / CHAI / CEYLON GINGER CINNAMON CHAI TEA
        </div>

        <div class="product-container">
            
            
            <div class="product-image">
                
                <img src="product-tea (2).png" alt="Ceylon Ginger Cinnamon Chai Tea">
            </div>

          
            <div class="product-info">
                <h1 class="product-title">Ceylon Ginger Cinnamon<br>chai tea</h1>
                <p class="product-description">A lovely warming Chai tea with ginger, cinnamon flavours.</p>

              
                <div class="product-tags">
                    <span>🌐 Origin: Iran</span>
                    <span>🌿 Organic</span>
                    <span>🌱 Vegan</span>
                </div>

                
                <div class="product-price">€3.90</div>

               
                <div class="product-variants">
                    <span class="label">Variants</span>
                    <div class="variant-buttons">
                        
                       
                        <button type="button" class="variant-card active">
                            <svg width="22" height="28" viewBox="0 0 24 30" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M6 8L8 2H16L18 8V26C18 27.1 17.1 28 16 28H8C6.9 28 6 27.1 6 26V8Z" stroke="#222" stroke-width="1.5"/>
                                <text x="12" y="19" font-size="7" text-anchor="middle" fill="#222" font-weight="bold">50</text>
                            </svg>
                            <span>50 g bag</span>
                        </button>

                       
                        <button type="button" class="variant-card">
                            <svg width="22" height="28" viewBox="0 0 24 30" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M6 8L8 2H16L18 8V26C18 27.1 17.1 28 16 28H8C6.9 28 6 27.1 6 26V8Z" stroke="#777" stroke-width="1.5"/>
                                <text x="12" y="19" font-size="7" text-anchor="middle" fill="#777">100</text>
                            </svg>
                            <span>100 g bag</span>
                        </button>

                       
                        <button type="button" class="variant-card">
                            <svg width="22" height="28" viewBox="0 0 24 30" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <rect x="6" y="4" width="12" height="22" rx="2" stroke="#777" stroke-width="1.5"/>
                                <line x1="6" y1="8" x2="18" y2="8" stroke="#777" stroke-width="1.5"/>
                                <text x="12" y="18" font-size="7" text-anchor="middle" fill="#777">170</text>
                            </svg>
                            <span>170 g bag</span>
                        </button>

                       
                        <button type="button" class="variant-card">
                            <svg width="22" height="28" viewBox="0 0 24 30" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M5 9L7 2H17L19 9V26C19 27.1 18.1 28 17 28H7C5.9 28 5 27.1 5 26V9Z" stroke="#777" stroke-width="1.5"/>
                                <text x="12" y="19" font-size="7" text-anchor="middle" fill="#777">250</text>
                            </svg>
                            <span>250 g bag</span>
                        </button>

                     
                        <button type="button" class="variant-card">
                            <svg width="22" height="28" viewBox="0 0 24 30" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M4 10L6 2H18L20 10V26C20 27.1 19.1 28 18 28H6C4.9 28 4 27.1 4 26V10Z" stroke="#777" stroke-width="1.5"/>
                                <text x="12" y="19" font-size="7" text-anchor="middle" fill="#777">1kg</text>
                            </svg>
                            <span>1 kg bag</span>
                        </button>

                        <button type="button" class="variant-card">
                            <svg width="22" height="28" viewBox="0 0 24 30" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M8 8L12 4L16 8V25H8V8Z" stroke="#777" stroke-width="1.5"/>
                                <path d="M12 4V1" stroke="#777" stroke-width="1.5"/>
                            </svg>
                            <span>Sampler</span>
                        </button>

                    </div>
                </div>

                
                <div class="product-actions">
                    <div class="quantity">
                        <button type="button">-</button>
                        <span>1</span>
                        <button type="button">+</button>
                    </div>
                    <button type="button" class="add-to-bag">🛍️ ADD TO BAG</button>
                </div>

            </div>

        </div>
    </section>

</body>
</html>
