
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Tea Brand Web Site">
    <title>Tea Brand</title>
    <link rel="icon" href="./favicon.png">
    
        <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Prosto+One&display=swap" rel="stylesheet">
    
  
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <section class="product-details">
      
        <div class="breadcrumb">
            HOME / COLLECTIONS / CHAI / CEYLON GINGER CINNAMON CHAI TEA
        </div>

        <div class="product-container">
            
            <div class="product-image">
                <img src="Rectangle 49.png" alt="Ceylon Ginger Cinnamon Chai Tea">
            </div>

            <div class="product-info">
                <h1 class="product-title">Ceylon Ginger Cinnamon<br>chai tea</h1>
                <p class="product-description">A lovely warming Chai tea with ginger, cinnamon flavours.</p>

                <div class="product-tags">
                    <span>🌐 Origin: Iran</span>
                    <span>🌿 Organic</span>
                    <span>🌱 Vegan</span>
                </div>

              
                <div class="product-price">€3.90</div>

                <div class="product-variants">
                    <span class="label">Variants</span>
                    <div class="variant-buttons">
                        
                        <button type="button" class="variant-card active">
                         <img src="Group 27 (5).svg" alt="">
                            <span>50 g bag</span>
                        </button>

                        <button type="button" class="variant-card">
                             <img src="Group 27 (4).svg" alt="">
                            <span>100 g bag</span>
                        </button>

                        <button type="button" class="variant-card">
                        <img src="Group (1).svg" alt="">
                            <span>170 g bag</span>
                        </button>

                        <button type="button" class="variant-card">
                           <img src="Group 27 (3).svg"alt="">
                            <span>250 g bag</span>
                        </button>

                        <button type="button" class="variant-card">
                             <img src="Group 27 (2).svg"alt="">
                            <span>1 kg bag</span>
                        </button>

                        <button type="button" class="variant-card">
                             <img src="Group 24.svg"alt="">
                            <span>Sampler</span>
                        </button>

                    </div>
                </div>

                <div class="product-actions">
                    <div class="quantity">
                        <button type="button">-</button>
                        <span>1</span>
                        <button type="button">+</button>
                    </div>
                    <button type="button" class="add-to-bag">🛍️ ADD TO BAG</button>
                </div>

            </div>

        </div>
    </section>

</body>
</html>
